# Demo Reservation / DemoTracker — nginx (RHEL 8.10)
# Install as /etc/nginx/conf.d/demotracker.conf
# Adjust server_name and TLS files. php-fpm socket must match the pool
# (typical: unix:/run/php-fpm/www.sock).

upstream demotracker_php {
    server unix:/run/php-fpm/www.sock;
}

# HTTP — use this first, then add TLS when you have certificates.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/websites/demotracker/public;
    index index.php;

    access_log /var/log/nginx/demotracker.access.log;
    error_log  /var/log/nginx/demotracker.error.log;

    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass demotracker_php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    location ~* \.(sql|md|ini|log)$ {
        deny all;
    }
}

