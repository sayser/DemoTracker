# DemoTracker — nginx (RHEL 8.10)
# Install as /etc/nginx/conf.d/demotracker.conf
# php-fpm socket must match the pool (typical: unix:/run/php-fpm/www.sock).

server_tokens off;

upstream demotracker_php {
    server unix:/run/php-fpm/www.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/websites/demotracker/public;
    index index.php;

    access_log /var/log/nginx/demotracker.access.log;
    error_log  /var/log/nginx/demotracker.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    if ($request_method !~ ^(GET|POST|HEAD)$) {
        return 405;
    }

    location ^~ /assets/ {
        location ~* \.php$ {
            deny all;
        }
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass demotracker_php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_param HTTP_PROXY "";
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(sql|md|ini|log|sh)$ {
        deny all;
    }
}

